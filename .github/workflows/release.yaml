name: release
on:
  push:
    branches:
    - main
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: tagpr
      if: github.ref == 'refs/heads/main'
      id: tagpr
      uses: Songmu/tagpr@v1.22.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: setup go
      if: steps.tagpr.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: release
      if: steps.tagpr.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.tagpr.outputs.tag || github.ref_name }}
      run: make crossbuild upload
